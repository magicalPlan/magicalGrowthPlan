<!-- 계약. 마법 → 마력 각인 → 재계약 시험 도전 → 운명의 재계약(스크롤).
     그리기는 js/pact/pact.js 의 pact(). 시험 본문은 html/trial/trial.html.
     각인 그리기는 js/growth/growth.js 의 drawRunes. -->
<div id="v-pact" hidden>
<h2>마법</h2>
<p class="hint" id="skh"></p>
<div class="hist" id="bgs"></div>
<h2>마력 각인</h2>
<p class="hint" id="rnh"></p>
<div class="hist" id="bgr"></div>
<h2>재계약 시험</h2>
<p class="hint">여왕님의 시련을 통과하면 등급이 오른다. 도전을 누르면 시험이 시작된다.</p>
<button class="btn g" id="b-trial" type="button">재계약 시험 도전</button>
<h2>운명의 재계약</h2>
<div class="hist" id="bgrt"></div>
<p class="msg" id="pcm" role="alert"></p>
</div>
