<div id="v-login" hidden>
<div class="card"><h2 id="lt">로그인</h2><p class="hint" id="lhint">아이디와 비밀번호로 로그인하면 캐릭터가 계정에 저장되어 어느 기기에서든 이어서 할 수 있다.</p>
<div class="tabs" id="lmode"><button type="button" id="lmode-id" aria-pressed="true">아이디로 로그인</button><button type="button" id="lmode-em" aria-pressed="false">이메일로 로그인</button></div>
<div id="lid-box"><h2 class="lbl">아이디</h2><input id="lid" type="text" maxlength="20" autocomplete="username" aria-label="아이디" placeholder="영문, 숫자, 밑줄 3~20자"></div>
<div id="lmail-box" hidden><h2 class="lbl">이메일</h2><input id="lmail" type="email" maxlength="80" autocomplete="email" aria-label="이메일" placeholder="연동한 이메일"></div>
<div id="lem" hidden><h2 class="lbl">이메일</h2><input id="lem-in" type="email" maxlength="80" autocomplete="email" aria-label="이메일" placeholder="받을 수 있는 이메일"><p class="hint">선택이다. 비워 두면 나중에 설정에서 연동할 수 있다. 아이디 로그인은 그대로다.</p></div>
<h2 class="lbl">비밀번호</h2><input id="lpw" type="password" autocomplete="current-password" aria-label="비밀번호" placeholder="6자 이상">
<div id="lcd" hidden><h2 class="lbl">비밀 코드</h2><input id="lcode" type="password" maxlength="40" autocomplete="off" aria-label="비밀 코드" placeholder="계정을 만들려면 비밀 코드가 필요하다"></div>
<div id="lk" hidden><h2 class="lbl">Firebase 웹 API 키</h2><input id="lkey" type="text" autocomplete="off" aria-label="Firebase 웹 API 키" placeholder="프로젝트 설정의 웹 API 키"></div>
<button class="btn" id="lgo" type="button">로그인</button>
<button class="btn g" id="lsw" type="button">계정이 없다면 계정 만들기</button>
<button class="btn g" id="lloc" type="button">서버 없이 혼자 하기</button>
<p class="msg" id="lm" role="alert"></p></div>
</div>
