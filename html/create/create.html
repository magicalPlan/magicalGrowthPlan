<!-- 캐릭터 제작. 동작은 js/create.js. 마을 탭의 제작 화면은 html/create/craft.html 과 js/create/craft.js 이다. -->
<div id="v-create" hidden>
<h2>이름</h2><input id="nm" type="text" maxlength="8" placeholder="최대 8자" autocomplete="off" aria-label="이름">
<h2>프로필 이미지</h2><p class="hint">선택 사항이다. 마을 화면에서 언제든 바꿀 수 있다.</p><div class="row" style="align-items:center"><img id="pv" class="av" alt="선택한 프로필 이미지" hidden><label class="btn g fl" style="width:auto;margin:0;padding:10px 16px;display:inline-block">이미지 고르기<input id="im" type="file" accept="image/*"></label></div>
<h2>소년 또는 소녀</h2><div class="row" id="gd"></div>
<h2>시작 마을</h2><p class="hint">마을은 한 번 고르면 바꿀 수 없다.</p><div class="row" id="vl"></div>
<h2>속성</h2><p class="hint">처음 고른 속성은 공방에서 만드는 속성의 프리즘으로만 바꿀 수 있다. 속성마다 효과가 있고, 재계약 시험에서 새 속성을 얻으면 그 효과도 함께 적용된다.</p><div class="row" id="at"></div>
<h2>계약 등급과 특성</h2><p class="hint">수정구에 손을 얹으면 등급과 특성이 함께 정해진다. 최대 3번 뽑고 하나를 고른다.</p>
<div class="stage"><button class="orb" id="orb" type="button" aria-label="등급 뽑기"><small>손을 얹는다</small></button><div id="left" aria-live="polite"></div></div>
<div class="hist" id="hist"></div><p class="hint" id="tdesc" style="margin-top:8px"></p>
<button class="btn" id="ok" type="button">이 계약으로 확정</button><p class="msg" id="cm" role="alert"></p>
</div>
