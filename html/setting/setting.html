<div id="v-setting" hidden>
    <h2>설정</h2>
    <p class="hint" id="set-note"></p>
    <h2>화면</h2>
    <p class="hint" id="set-thm"></p>
    <button class="btn g" id="set-theme" type="button">화면 모드 바꾸기</button>
    <!-- <h2>서버</h2>
    <p class="hint">온라인으로 이어서 하려면 Firebase Realtime Database 주소가 필요하다.</p>
<button class="btn g" id="set-srv" type="button">서버 주소 설정</button> -->
    <h2>계정</h2>
    <p class="hint" id="set-em"></p>
    <button class="btn g" id="set-mail" type="button">이메일 연동</button>
    <form id="set-mail-box" hidden>
        <div id="set-mail-idbox" hidden>
            <h2 class="lbl">아이디</h2>
            <input id="set-mail-id" type="text" maxlength="20" autocomplete="username" aria-label="아이디" placeholder="가입할 때 쓴 아이디">
        </div>
        <h2 class="lbl">이메일</h2>
        <input id="set-mail-em" type="email" maxlength="80" autocomplete="email" aria-label="연동할 이메일" placeholder="받을 수 있는 이메일">
        <h2 class="lbl">비밀번호</h2>
        <input id="set-mail-pw" type="password" autocomplete="current-password" aria-label="현재 비밀번호" placeholder="지금 비밀번호">
        <button class="btn" id="set-mail-go" type="submit">연동하기</button>
    </form>
    <button class="btn g" id="set-pw" type="button" hidden>비밀번호 변경</button>
    <form id="set-pw-box" hidden>
        <p class="hint">연동된 이메일이 있는 계정만 바꿀 수 있습니다.</p>
        <h2 class="lbl">현재 비밀번호</h2>
        <input id="set-pw-old" type="password" autocomplete="current-password" aria-label="지금 비밀번호" placeholder="지금 비밀번호">
        <h2 class="lbl">새 비밀번호</h2>
        <input id="set-pw-new" type="password" autocomplete="new-password" aria-label="새 비밀번호" placeholder="6자 이상">
        <h2 class="lbl">새 비밀번호 확인</h2>
        <input id="set-pw-new2" type="password" autocomplete="new-password" aria-label="새 비밀번호 확인" placeholder="한 번 더">
        <button class="btn" id="set-pw-go" type="submit">변경하기</button>
    </form>
    <button class="btn g" id="set-out" type="button">로그아웃</button>
    <div class="set-leave-row"><button type="button" class="set-fold-mark" id="set-leave">회원 탈퇴</button></div>
    <h2>연락처</h2>
    <a class="btn g" href="https://x.com/magicalgrowthS2" target="_blank" rel="noopener noreferrer">공식 계정</a>
    <a class="btn g" href="https://forms.gle/NSwT43TFvHqt2fAV9" target="_blank" rel="noopener noreferrer">문의 창구</a>

<details class="set-fold" id="set-odds-fold">
<summary><span class="set-fold-row"><span class="set-fold-t">확률 안내</span><span class="set-fold-mark">펼치기</span></span></summary>
<p class="hint">같은 등급 내에서의 확률은 동일합니다. </p>
<div id="set-odds"></div>
</details>
<p class="msg" id="setm" role="alert"></p>
<p class="set-ver" id="set-ver">앱 버전 1.0.0</p>
</div>
